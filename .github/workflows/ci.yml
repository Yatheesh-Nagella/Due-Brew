name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duebrew
          POSTGRES_PASSWORD: test
          POSTGRES_DB: duebrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duebrew -d duebrew_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://duebrew:test@localhost:5432/duebrew_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    # Builds every image for the Pi's arm64 under QEMU, so an image that
    # won't build on the Pi fails here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Stand-in for the network Caddy creates on the Pi
        run: docker network create caddy_webnet
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh deploy/test/*.sh scripts/*.sh
      - run: bash deploy/test/test_deploy.sh
